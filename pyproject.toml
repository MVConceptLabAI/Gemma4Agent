[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aireceipes"
version = "0.1.0"
description = "Container-friendly classified AI benchmark recipes for inference, finetuning, and agentic workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aireceipes = "aireceipes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
