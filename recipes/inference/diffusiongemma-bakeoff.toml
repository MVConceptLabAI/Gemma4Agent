id = "inference.diffusiongemma-bakeoff"
category = "inference"
name = "DiffusionGemma vertical bakeoff"
description = "Runs the shared Gemma 4 vertical benchmark against a DiffusionGemma endpoint. Compare raw token/s with effective token/s because DiffusionGemma may trade some quality for speed."
tags = ["diffusiongemma", "gemma4", "diffusion", "openai-compatible", "translation", "chat", "code", "agentic", "ttft", "tokens-per-sec"]

[classification]
task = "gemma4-variant-bakeoff"
modality = "text"
size = "vertical-smoke"
model_family = "diffusiongemma"
variant = "diffusion-block-denoising"
serving = "openai-compatible-chat"
source_urls = ["https://diffrun.dev/"]

[runtime]
adapter = "openai_compatible_chat"
target_gpu = "RTX A6000"
base_url = "http://127.0.0.1:18081/v1"
base_url_env = "DIFFUSIONGEMMA_BASE_URL"
model = "diffusiongemma-26B-A4B-it"
model_env = "DIFFUSIONGEMMA_MODEL"
api_key_env = "DIFFUSIONGEMMA_API_KEY"
start_command_env = "DIFFUSIONGEMMA_START_COMMAND"
stop_command_env = "DIFFUSIONGEMMA_STOP_COMMAND"
ready_url = "http://127.0.0.1:18081/v1/models"
ready_url_env = "DIFFUSIONGEMMA_READY_URL"
ready_timeout_seconds = 900
ready_poll_seconds = 2
startup_grace_seconds = 2
unload_wait_seconds = 10
system_prompt = "You are a precise benchmark participant. Follow the user's formatting constraints exactly. Do not include hidden reasoning or benchmark commentary."
timeout_seconds = 240
notes = "Sequential bakeoff loads this model third on the RTX A6000 when DIFFUSIONGEMMA_START_COMMAND is set, waits for readiness, runs the test, then unloads it. Use a DiffusionGemma server that exposes /v1/chat/completions and supports streaming for TTFT. vLLM main is preferred; a specialized llama-diffusion-gemma server can also be used when it exposes OpenAI-compatible chat."

[parameters]
repetitions = 3
temperature = 0.0
top_p = 0.95
top_k = 64
max_tokens = 256
seed = 42
stream = true
stream_include_usage = true

[[dataset.cases]]
id = "translation.fr.simple"
vertical = "translation"
prompt = "Translate to French. Output only the translation, no explanation: The cat sleeps under the blue table."
expected_contains = ["chat", "dort", "table", "bleue"]
expected_not_contains = ["explanation", "The cat"]

[[dataset.cases]]
id = "chat.thanks"
vertical = "chat"
prompt = "Reply in exactly one short sentence: A teammate fixed a flaky test. Thank them and mention tests."
expected_contains = ["thank", "test"]
expected_regex = ['[.!]$']

[[dataset.cases]]
id = "code.python.add"
vertical = "code"
prompt = "Write only Python code for a function add(a, b) that returns their sum."
expected_contains = ["def add", "return"]
expected_regex = ['return\s+a\s*\+\s*b|return\s*b\s*\+\s*a']
expected_not_contains = ["```"]

[[dataset.cases]]
id = "agentic.cleanup.plan"
vertical = "agentic"
prompt = "You are an agent planning a safe file cleanup workflow. Return exactly three numbered steps, then final line ANSWER: ready. Do not execute anything."
expected_regex = ['(?m)^1\.', '(?m)^2\.', '(?m)^3\.', '(?m)^ANSWER:\s*ready\s*$']
expected_not_contains = ["rm -rf /"]

[kpis]
metrics = [
  "success_rate",
  "case_success_rate",
  "accuracy",
  "quality_loss",
  "loss_proxy",
  "loss_avg",
  "eval_loss_avg",
  "workflow_success_rate",
  "ttft_ms_avg",
  "latency_ms_avg",
  "tokens_per_sec",
  "end_to_end_tokens_per_sec",
  "effective_tokens_per_sec",
  "completion_tokens_total",
  "output_tokens_avg"
]
