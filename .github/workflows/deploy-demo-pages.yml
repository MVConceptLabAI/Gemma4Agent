name: Deploy Gemma 4 demo pages

on:
  push:
    branches:
      - agent/add-gemma4-captioner-variants
    paths:
      - "Gemma4Captionner/full/docs/**"
      - ".github/workflows/deploy-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Gemma4Captionner/full/docs
      - id: deployment
        uses: actions/deploy-pages@v4
