name: Publish Gemma 4 Captioner image

on:
  push:
    tags:
      - "gemma4-submission-*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish public linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: Gemma4Captionner/full
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mvconceptlabai/gemma4-captioner:${{ github.ref_name }}
            ghcr.io/mvconceptlabai/gemma4-captioner:latest
      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/gemma4-captioner" -f visibility=public
      - name: Verify published manifest
        run: docker buildx imagetools inspect ghcr.io/mvconceptlabai/gemma4-captioner:${{ github.ref_name }}
