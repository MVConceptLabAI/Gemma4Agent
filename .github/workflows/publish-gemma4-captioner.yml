name: Publish Gemma 4 Captioner image

on:
  push:
    tags:
      - "gemma4-submission-*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The temporary submission keys are stored as environment secrets.
    environment: OPENROUTER_API_KEY
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish public linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: Gemma4Captionner/full
          platforms: linux/amd64
          push: true
          # Keep one plain amd64 manifest. Some hackathon pullers reject
          # BuildKit's auxiliary unknown/unknown attestation manifest.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/mvconceptlabai/gemma4-captioner:${{ github.ref_name }}
            ghcr.io/mvconceptlabai/gemma4-captioner:latest
          # The hackathon does not inject runtime variables. These repository
          # secrets are intentionally passed only when publishing a submission
          # image; never commit literal values to this repository.
          build-args: |
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
      - name: Verify published manifest
        run: docker buildx imagetools inspect ghcr.io/mvconceptlabai/gemma4-captioner:${{ github.ref_name }}
