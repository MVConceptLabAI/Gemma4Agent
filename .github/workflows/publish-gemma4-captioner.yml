name: Publish Gemma 4 Captioner image

on:
  push:
    tags:
      - "gemma4-submission-*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to build (for example gemma4-submission-v20)"
        required: false
        type: string
      image_tag:
        description: "Published image tag (for example gemma4-submission-v20)"
        required: false
        type: string
      publish_latest:
        description: "Also update the latest tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The temporary submission keys are stored as environment secrets.
    environment: OPENROUTER_API_KEY
    steps:
      # A manual run can publish an existing historical submission tag without
      # changing that tag's source or force-moving it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish public linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: Gemma4Captionner/full
          platforms: linux/amd64
          push: true
          # Keep one plain amd64 manifest. Some hackathon pullers reject
          # BuildKit's auxiliary unknown/unknown attestation manifest.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/mvconceptlabai/gemma4-captioner:${{ inputs.image_tag || github.ref_name }}
            docker.io/mvconceptlab/gemma4-captioner:${{ inputs.image_tag || github.ref_name }}
            ${{ inputs.publish_latest && 'ghcr.io/mvconceptlabai/gemma4-captioner:latest' || '' }}
            ${{ inputs.publish_latest && 'docker.io/mvconceptlab/gemma4-captioner:latest' || '' }}
          # The hackathon does not inject runtime variables. These repository
          # secrets are intentionally passed only when publishing a submission
          # image; never commit literal values to this repository.
          build-args: |
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            FIREWORKS_API_KEY=${{ secrets.FIREWORKS_API_KEY }}
      - name: Verify published manifest
        run: |
          docker buildx imagetools inspect ghcr.io/mvconceptlabai/gemma4-captioner:${{ inputs.image_tag || github.ref_name }}
          docker buildx imagetools inspect docker.io/mvconceptlab/gemma4-captioner:${{ inputs.image_tag || github.ref_name }}
